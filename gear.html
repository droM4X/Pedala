<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pedala remote</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101418;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}header{height:56px;display:flex;align-items:center;gap:10px;font-weight:700}#dot{width:12px;height:12px;border-radius:50%;background:#e54b4b}#dot.on{background:#39d98a}#readout{height:26%;display:flex;flex-direction:column;align-items:center;justify-content:center}#value{font-size:clamp(64px,20vw,120px);line-height:1}#sub{margin-top:8px;color:#aab4bd;font-size:18px}#pad{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:10px}#pad button{flex:1;min-height:96px;border:0;border-radius:20px;background:#27333d;color:white;font-size:48px;font-weight:700}#pad button:active{background:#40515f}#pad button:disabled{opacity:.45}#ctrl{display:flex;gap:12px;padding-bottom:10px}#ctrl button{flex:1;min-height:56px;border:0;border-radius:20px;background:#27333d;color:white;font-size:22px;font-weight:700}#ctrl button:active{background:#40515f}#ctrl button:disabled{opacity:.45}#confirm{border:0;border-radius:16px;background:#27333d;color:#fff;padding:20px 18px;font-size:18px}#confirm::backdrop{background:rgba(16,20,24,.7)}#confirm .cacts{display:flex;gap:12px;margin-top:14px}#confirm .cacts button{flex:1;min-height:48px;border:0;border-radius:12px;background:#3b4a56;color:white;font-size:18px;font-weight:700}#confirm .cacts button:active{background:#4c5f6d}#conn{padding:12px 0}#addr{width:65%;padding:12px;font-size:16px}#conn button{padding:12px}#change{border:0;background:none;color:#aab4bd;font-size:12px}
</style></head><body>
<header><span id="dot"></span><span id="title">Pedala remote</span><button id="change" type="button">Change</button></header>
<div id="readout"><b id="value">–</b><small id="sub"></small></div>
<div id="pad"><button id="up" aria-label="Harder gear">+</button><button id="down" aria-label="Easier gear">−</button></div>
<div id="ctrl"><button id="go">Start</button><button id="fin">Finish</button></div>
<dialog id="confirm"><p>Finish the workout?</p><div class="cacts"><button id="fin-yes">Finish</button><button id="fin-no">Cancel</button></div></dialog>
<form id="conn" hidden><input id="addr" inputmode="url" autocomplete="off" spellcheck="false" placeholder="192.168.1.20:8765"><button type="submit">Connect</button></form>
<script>
(()=>{const key="pedala.remote.addr", $=s=>document.querySelector(s), form=$("#conn"), field=$("#addr"), dot=$("#dot"), title=$("#title"), value=$("#value"), sub=$("#sub"), buttons=[$("#up"),$("#down")],go=$("#go"),fin=$("#fin"),cd=$("#confirm");let base=localStorage.getItem(key)||location.origin,es=null,last=0,errors=0,st=null;
function normalize(s){s=s.trim().replace(/\/+$/g,"");if(s&&!/^https?:\/\//i.test(s))s="http://"+s;return s}
function render(){if(!st)return;let mode=st.mode;if(mode==="bias"){value.textContent=Math.round(st.bias*100)+"%";sub.textContent="Intensity"}else if(mode==="hr"){value.textContent=(st.hrOff>0?"+":"")+st.hrOff;sub.textContent="HR offset"}else{value.textContent=st.gear;sub.textContent="Gear · 24"}if(st.ride===false){sub.textContent="No ride running";buttons.forEach(b=>b.disabled=true);go.disabled=true;fin.disabled=true;dot.classList.remove("on");title.textContent="Pedala remote"}else{buttons.forEach(b=>b.disabled=false);go.disabled=false;fin.disabled=!st.started;go.textContent=st.running?"Pause":"Start"}}
function connect(){errors=0;base=normalize(base);if(!base){form.hidden=false;return}if(es)es.close();es=new EventSource(base+"/__remote/events?role=phone");es.onopen=()=>{errors=0;last=Date.now();title.textContent="Pedala remote";localStorage.setItem(key,base);form.hidden=true};for(const name of ["hello","state"])es.addEventListener(name,e=>{st=JSON.parse(e.data);last=Date.now();render()});es.addEventListener("ping",()=>last=Date.now());es.onerror=()=>{errors++;if(errors>=5){title.textContent="Cannot reach "+base;field.value=base;form.hidden=false;es.close();es=null}}}
$("#change").onclick=()=>{field.value=base;form.hidden=false;field.focus()};form.onsubmit=e=>{e.preventDefault();base=normalize(field.value);connect()};buttons.forEach((b,i)=>b.addEventListener("click",()=>{if(!b.disabled)fetch(base+"/__remote/shift",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({d:i===0?1:-1}),keepalive:true}).catch(()=>{})}));
go.addEventListener("click",()=>{if(!go.disabled)fetch(base+"/__remote/control",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({a:"start"}),keepalive:true}).catch(()=>{})});
fin.addEventListener("click",()=>cd.showModal());
$("#fin-no").addEventListener("click",()=>cd.close());
$("#fin-yes").addEventListener("click",()=>{cd.close();fetch(base+"/__remote/control",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({a:"finish"}),keepalive:true}).catch(()=>{})});
setInterval(()=>{const live=!!(es&&es.readyState===1&&Date.now()-last<25000&&(!st||st.ride!==false));dot.classList.toggle("on",live);if(es&&es.readyState===1&&Date.now()-last>=25000){es.close();connect()}},3000);base=normalize(base);if(base)connect();else form.hidden=false;
})();
</script></body></html>
